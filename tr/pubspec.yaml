name: field_force
description: Field Sales Force Management - Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State and navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Network
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Location
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

  # Camera and face
  camera: ^0.11.0+1
  google_mlkit_face_detection: ^0.11.0
  tflite_flutter: ^0.11.0
  image: ^4.2.0

  # Device info for session list
  device_info_plus: ^10.1.0
  battery_plus: ^6.0.1

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
